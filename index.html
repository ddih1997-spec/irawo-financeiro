<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IRAWÒ Financeiro</title>
<meta name="theme-color" content="#f3f4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IRAWÒ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f4f7; --card:#ffffff; --card2:#eef0f5; --line:#e3e6ec; --line2:#d2d7e0;
  --txt:#1c2230; --mut:#6b7385; --acc:#3b4cca; --silver:#3b4cca; --gold:#c27a0e;
  --green:#0f9d6b; --red:#d6455d; --amber:#d9822b; --teal:#0e9db8; --violet:#7a4bd1; --coral:#d9822b;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top .logo{font-weight:700;letter-spacing:.3em;font-size:15px;background:linear-gradient(90deg,#3b4cca,#7a4bd1);-webkit-background-clip:text;background-clip:text;color:transparent}
header.top .sub{color:var(--mut);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-left:auto}
main{max-width:980px;margin:0 auto;padding:18px 16px}
h2{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:26px 0 10px}
h2:first-child{margin-top:4px}
#modalBox h2,.lock h2{font-size:18px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--txt)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(28,34,48,.04),0 4px 14px rgba(28,34,48,.04)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}}
.kpi .l{color:var(--mut);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.kpi .v{font-size:22px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{color:var(--mut);font-size:12px;margin-top:3px}
.pos{color:var(--green)}.neg{color:var(--red)}.gold{color:var(--gold)}.mut{color:var(--mut)}
.mes{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px}
.mes b{min-width:170px;text-align:center;font-weight:700}
.mes b::first-letter{text-transform:uppercase}
.icbtn{background:var(--card);border:1px solid var(--line2);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(59,76,202,.25)}
.btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--line2);box-shadow:none}
.btn.danger{background:transparent;color:var(--red);border:1px solid #efb5bf;box-shadow:none}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}
.btn.green{background:var(--green);box-shadow:0 2px 6px rgba(15,157,107,.25)}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--card2);color:var(--mut);border:1px solid var(--line2)}
.chip.red{color:#c0364e;border-color:#f0b9c2;background:#fdecef}
.chip.green{color:#0e7a50;border-color:#b4e2cf;background:#e9f8f1}
.chip.gold{color:#9a6200;border-color:#ecd29a;background:#fdf5e4}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:7px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line2);cursor:pointer;font-size:13px;color:var(--mut)}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.item{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;cursor:pointer}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .d{color:var(--mut);font-size:12.5px;margin-top:2px}
.item .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#0f9d6b,#0e9db8)}
.svc{margin-bottom:12px}
.svc .head{cursor:pointer}
.parc{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:12px 0 5px}
label.opt{display:flex;gap:10px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:14px;font-weight:400;color:var(--txt);margin:10px 0 0;cursor:pointer}
label.opt input{width:auto;margin-top:3px}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:11px 12px;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(59,76,202,.15)}
textarea{min-height:90px;resize:vertical}
.field2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 10px 18px;text-align:center;cursor:pointer;font-weight:600;box-shadow:0 1px 2px rgba(28,34,48,.04),0 4px 14px rgba(28,34,48,.04)}
.tile:active{background:var(--card2)}
.tile .e{display:block;width:32px;height:32px;margin:0 auto 12px}
.tile .e svg{width:32px;height:32px;stroke:var(--acc);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile:nth-child(2) .e svg{stroke:var(--teal)}.tile:nth-child(3) .e svg{stroke:var(--violet)}.tile:nth-child(4) .e svg{stroke:var(--amber)}
.tile small{display:block;color:var(--mut);font-weight:400;font-size:12px;margin-top:3px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
nav.bottom button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:6px 10px;cursor:pointer;min-width:58px}
nav.bottom button.on{color:var(--acc)}
nav.bottom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button.mais{background:linear-gradient(135deg,#3b4cca,#7a4bd1);color:#fff;border-radius:50%;width:52px;height:52px;min-width:52px;margin-top:-20px;justify-content:center;box-shadow:0 6px 16px rgba(59,76,202,.4),0 0 0 4px var(--bg)}
#modal{position:fixed;inset:0;z-index:50;background:rgba(20,24,36,.45);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px 18px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--line)}
@media(min-width:760px){#modal{align-items:center}#modal .box{border-radius:18px}}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c2230;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:80;display:none;max-width:90vw;box-shadow:0 8px 24px rgba(28,34,48,.3)}
#toast.err{background:var(--red);color:#fff}
.lock{position:fixed;inset:0;z-index:100;background:radial-gradient(1000px 500px at 50% -10%,#e3e7fb,var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;text-align:center}
.lock .mark{font-size:26px;font-weight:700;letter-spacing:.4em;margin-right:-.4em;background:linear-gradient(90deg,#3b4cca,#7a4bd1);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.lock input{max-width:320px;text-align:center}
.rev{border:1px solid var(--line2);border-left:4px solid var(--acc);border-radius:var(--r);padding:16px;margin-bottom:12px;background:var(--card)}
.spin{width:20px;height:20px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:g .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes g{to{transform:rotate(360deg)}}
.rec-dot{width:11px;height:11px;border-radius:50%;background:var(--red);display:inline-block;animation:p 1s infinite}
@keyframes p{50%{opacity:.25}}
canvas{max-width:100%}
.grid>*,.row>*{min-width:0}
.kpi .v{overflow-wrap:anywhere}
@media(max-width:360px){.kpi .v{font-size:18px}main{padding:12px}}
.empty{text-align:center;color:var(--mut);padding:28px 10px;line-height:1.5}
.hint{font-size:13px;color:var(--mut);line-height:1.5}
details summary{cursor:pointer;color:var(--acc);margin:8px 0;font-weight:600}
a{color:var(--acc)}
</style>
</head>
<body>
<header class="top"><span class="logo">IRAWÒ</span><span class="sub" id="subtitulo">Controle financeiro</span></header>
<main id="view"></main>
<nav class="bottom" id="nav"></nav>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<div id="lockHost"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="logica.js"></script>
<script>
'use strict';
/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const ls = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
function toast(msg, erro) {
  const t = $('#toast'); t.textContent = msg; t.className = erro ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', erro ? 5000 : 2500);
}
const b64e = buf => { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const blobB64 = blob => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(String(f.result).split(',')[1]); f.onerror = rej; f.readAsDataURL(blob); });

/* ============ estado e acesso aos dados ============ */
let cfg = ls.get('irawo_cfg', null);           // {url, token}
let rows = ls.get('irawo_cache', []);
let catalogo = ls.get('irawo_cat', []);   // receitas padrão [{nome, valor, categoria}]
let ctxBaixa = null;
function aplicaCategorias(c) { if (c && c.receita && c.receita.length && c.despesa && c.despesa.length) { L.CATEGORIAS.receita = c.receita.slice(); L.CATEGORIAS.despesa = c.despesa.slice(); } }
aplicaCategorias(ls.get('irawo_catg', null));
let view = 'inicio';
let mesSel = L.mesDe(L.hojeDe());
let abertos = new Set();
let filtroExtrato = { tipo: 'todos', status: 'todos', mes: '' };
let abaReceber = 'receita';
let verQuitados = false;
let revisao = null;      // {itens:[...], mensagem}
let sugestaoBaixa = null; // {busca, candidatos}
let carregando = false;
let charts = [];

async function api(acao, extra = {}) {
  if (!cfg) throw new Error('App ainda não configurado (Ajustes).');
  if (cfg.url === 'demo') return demoApi(acao, extra);
  let r;
  try {
    r = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: cfg.token, acao, ...extra }) });
  } catch { throw new Error('Sem conexão com a planilha. Confira a internet.'); }
  let j;
  try { j = await r.json(); } catch { throw new Error('Resposta inesperada do servidor.'); }
  if (!j.ok) throw new Error(j.erro || 'Erro no servidor');
  return j;
}

/* modo demonstração (dados só neste aparelho, para testar o app) */
function demoApi(acao, ex) {
  let d = ls.get('irawo_demo', []);
  const salva = () => ls.set('irawo_demo', d);
  switch (acao) {
    case 'status': return { ok: true, temChave: true, modelo: 'demo' };
    case 'listar': return { ok: true, dados: d };
    case 'adicionar': ex.itens.forEach(i => d.push({ ...i, id: L.uid(), criado_em: new Date().toISOString() })); salva(); return { ok: true, dados: d };
    case 'atualizar': ex.itens.forEach(i => { const x = d.find(r => r.id === i.id); if (x) Object.assign(x, i); }); salva(); return { ok: true, dados: d };
    case 'excluir': d = d.filter(r => !ex.ids.includes(r.id)); salva(); return { ok: true, dados: d };
    case 'salvarChave': return { ok: true, temChave: true };
    case 'catalogo': { let c = ls.get('irawo_demo_cat', null); if (!c) { c = [{ nome: 'BORI', valor: 3000, categoria: 'Serviços e trabalhos' }, { nome: 'EBÓ', valor: 800, categoria: 'Serviços e trabalhos' }, { nome: 'Yahuaska', valor: 300, categoria: 'Serviços e trabalhos' }]; ls.set('irawo_demo_cat', c); } return { ok: true, dados: c }; }
    case 'categorias': return { ok: true, dados: ls.get('irawo_demo_catg', { receita: L.CATEGORIAS.receita, despesa: L.CATEGORIAS.despesa }) };
    case 'salvarCategorias': ls.set('irawo_demo_catg', { receita: ex.receita, despesa: ex.despesa }); return { ok: true, dados: { receita: ex.receita, despesa: ex.despesa } };
    case 'salvarCatalogo': ls.set('irawo_demo_cat', ex.itens); return { ok: true, dados: ex.itens };
    case 'ia': throw new Error('A IA não funciona no modo demonstração.');
  }
  throw new Error('Ação desconhecida');
}
function semearDemo() {
  const h = L.hojeDe(), m = n => L.addMeses(h, n);
  const lista = [];
  const add = it => L.expandir(it, h).forEach(r => lista.push({ ...r, id: L.uid(), criado_em: h }));
  add({ tipo: 'receita', descricao: 'Trabalho de abertura de caminhos', pessoa: 'Maria Souza', categoria: 'Serviços e trabalhos', valor_total: 3000, parcelas: 6, entrada: 500, data: m(-2), primeiro_vencimento: m(-1) });
  add({ tipo: 'receita', descricao: 'Festa de Oxum', pessoa: 'Comunidade', categoria: 'Festas e eventos', valor_total: 4200, parcelas: 3, data: h, primeiro_vencimento: m(0) });
  add({ tipo: 'receita', descricao: 'Curso de iniciação', pessoa: 'João Lima', categoria: 'Cursos e oficinas', valor_total: 1200, parcelas: 4, data: m(-1), primeiro_vencimento: m(-1), entrada: 300 });
  add({ tipo: 'receita', descricao: 'Doações do mês', categoria: 'Doações', valor_total: 850, parcelas: 1, pago: true, data: h });
  add({ tipo: 'despesa', descricao: 'Velas, ervas e velas de 7 dias', pessoa: 'Casa das Ervas', categoria: 'Materiais e oferendas', valor_total: 420, pago: true, data: m(0) });
  add({ tipo: 'despesa', descricao: 'Aluguel do terreiro', pessoa: 'Imobiliária Central', categoria: 'Aluguel e contas', valor_total: 1800, pago: true, data: h });
  add({ tipo: 'despesa', descricao: 'Comida da festa', pessoa: 'Mercado Bom Preço', categoria: 'Alimentação e insumos', valor_total: 960, pago: true, data: h });
  add({ tipo: 'despesa', descricao: 'Reforma do telhado', pessoa: 'Seu Antônio', categoria: 'Manutenção e obras', valor_total: 2400, parcelas: 4, data: m(-1), primeiro_vencimento: m(0) });
  ls.set('irawo_demo', lista);
}

async function carregar(silencioso) {
  if (!cfg) return render();
  if (!silencioso) { carregando = true; render(); }
  try {
    const j = await api('listar');
    rows = j.dados; ls.set('irawo_cache', rows);
    try { const c = await api('catalogo'); catalogo = c.dados; ls.set('irawo_cat', catalogo); } catch {}
    try { const g = await api('categorias'); aplicaCategorias(g.dados); ls.set('irawo_catg', g.dados); } catch {}
  } catch (e) { toast(e.message + ' (mostrando dados salvos)', true); }
  carregando = false; render();
}
async function salvarOp(acao, extra, msg) {
  try {
    const j = await api(acao, extra);
    rows = j.dados; ls.set('irawo_cache', rows);
    if (msg) toast(msg);
    return true;
  } catch (e) { toast(e.message, true); return false; }
}

/* ============ navegação ============ */
const ICONES = {
  inicio: '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  receber: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  lancar: '<path d="M12 5v14M5 12h14"/>',
  extrato: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  ajustes: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
};
const NAV = [['inicio', 'Início'], ['receber', 'Contas'], ['lancar', 'Lançar'], ['extrato', 'Extrato'], ['ajustes', 'Ajustes']];
function renderNav() {
  $('#nav').innerHTML = NAV.map(([k, n]) => `<button data-go="${k}" class="${view === k ? 'on' : ''} ${k === 'lancar' ? 'mais' : ''}"><svg viewBox="0 0 24 24">${ICONES[k]}</svg>${k === 'lancar' ? '' : n}</button>`).join('');
}
function ir(v) { view = v; window.scrollTo(0, 0); render(); }

function render() {
  charts.forEach(c => c.destroy()); charts = [];
  renderNav();
  const v = $('#view');
  if (!cfg && view !== 'ajustes') { view = 'ajustes'; renderNav(); }
  v.innerHTML = ({ inicio: vInicio, receber: vReceber, lancar: vLancar, extrato: vExtrato, ajustes: vAjustes }[view])();
  $('#subtitulo').textContent = cfg && cfg.url === 'demo' ? 'Modo demonstração' : 'Financeiro';
  if (view === 'inicio') desenharGraficos();
}

/* ============ INÍCIO (dashboard) ============ */
function kpi(l, v, cls, s) { return `<div class="card kpi"><div class="l">${l}</div><div class="v ${cls || ''}">${brl(v)}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`; }
function vInicio() {
  if (carregando && !rows.length) return `<div class="empty"><span class="spin"></span><p>Carregando…</p></div>`;
  const hj = L.hojeDe(), r = L.resumo(rows, mesSel, hj);
  const ultimos = rows.slice().sort((a, b) => String(b.data_pagamento || b.vencimento).localeCompare(String(a.data_pagamento || a.vencimento))).filter(x => x.status === 'pago').slice(0, 6);
  let alertas = '';
  if (r.vencidoReceber > 0) alertas += `<div class="card" style="border-color:var(--red);margin-bottom:10px"><b class="neg">${brl(r.vencidoReceber)}</b> a receber está <b>atrasado</b>. <a href="#" data-go="receber" style="color:var(--gold)">Ver contas</a></div>`;
  if (r.vencidoPagar > 0) alertas += `<div class="card" style="border-color:var(--amber);margin-bottom:10px"><b>${brl(r.vencidoPagar)}</b> de contas a pagar vencidas.</div>`;
  if (r.proximos7Receber > 0) alertas += `<div class="card" style="margin-bottom:10px"><b class="gold">${brl(r.proximos7Receber)}</b> vence nos próximos 7 dias.</div>`;
  return `
  <div class="mes"><button class="icbtn" data-mes="-1">‹</button><b>${L.rotuloMes(mesSel)}</b><button class="icbtn" data-mes="1">›</button></div>
  ${alertas}
  <div class="grid kpis">
    ${kpi('Receitas do mês', r.recebido, 'pos', 'efetivamente recebido')}
    ${kpi('Gastos no mês', r.gasto, 'neg', 'pagos')}
    ${kpi('Saldo do mês', r.saldo, r.saldo >= 0 ? 'pos' : 'neg', 'recebido − gastos')}
    ${kpi('Total a receber', r.aReceber, 'gold', `${brl(r.mesAReceber)} vence neste mês`)}
  </div>

// gravação de áudio
let gravador = null;
function abrirGravacao() {
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Este navegador não grava áudio. Use o botão de anexar.', true);
  modal(`<h2 style="margin-top:0">Gravando…</h2><div style="text-align:center;padding:14px"><span class="rec-dot"></span> <b id="tempoRec">0:00</b>
  <p class="hint">Fale o que aconteceu: o quê, quanto, com quem, e se é parcelado.</p>
  <div class="row" style="justify-content:center"><button class="btn sec" id="cancelRec">Cancelar</button><button class="btn green" id="okRec">Terminar e enviar</button></div>
  <p class="hint" style="margin-top:14px">Ou <a href="#" id="anexarAudio" style="color:var(--gold)">anexar um áudio</a> (ex.: do WhatsApp).</p></div>`);
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    const pedacos = []; const mr = new MediaRecorder(stream);
    const t0 = Date.now();
    const tm = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); const el = $('#tempoRec'); if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; if (s >= 120) $('#okRec') && $('#okRec').click(); }, 500);
    mr.ondataavailable = e => e.data.size && pedacos.push(e.data);
    gravador = { mr, stream, tm, pedacos, enviar: false };
    mr.onstop = async () => {
      clearInterval(tm); stream.getTracks().forEach(t => t.stop());
      if (!gravador.enviar) return;
      try { fecharModal(); bloquear('Preparando o áudio…'); const wav = await blobParaWav(new Blob(pedacos, { type: mr.mimeType })); await interpretar([{ tipo: 'audio', formato: 'wav', base64: wav }]); }
      catch (e) { toast('Não consegui processar o áudio: ' + e.message, true); render(); }
    };
    mr.start();
  }).catch(() => { fecharModal(); toast('Permita o uso do microfone para gravar.', true); });
}
async function blobParaWav(blob) {
  const buf = await blob.arrayBuffer();
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const audio = await new Promise((res, rej) => ac.decodeAudioData(buf, res, rej));
  ac.close && ac.close();
  const sr = 16000, off = new OfflineAudioContext(1, Math.max(1, Math.ceil(audio.duration * sr)), sr);
  const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const dv = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const w = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE'); w(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
  dv.setUint16(22, 1, true); dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) { const s = Math.max(-1, Math.min(1, pcm[i])); dv.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return b64e(dv.buffer);
}
function reduzImagem(file, max = 1600) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('imagem inválida')), 'image/jpeg', 0.85);
    };
    img.onerror = () => rej(new Error('Não consegui abrir a imagem.'));
    img.src = url;
  });
}

async function hashSenha(pw, saltB64) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return b64e(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64d(saltB64), iterations: 150000, hash: 'SHA-256' }, k, 256));
}
async function definirSenha(pw) {
  const salt = b64e(crypto.getRandomValues(new Uint8Array(16)));
  const old = ls.get('irawo_auth', null);
  ls.set('irawo_auth', { salt, hash: await hashSenha(pw, salt), cred: old ? old.cred : null });
}
async function registrarBiometria() {
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'IRAWÒ' },
    user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'irawo', displayName: 'IRAWÒ' },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' }, timeout: 60000 } });
  const a = ls.get('irawo_auth'); a.cred = b64e(cred.rawId); ls.set('irawo_auth', a);
}
async function entrarComBiometria() {
  const a = ls.get('irawo_auth'); if (!a || !a.cred) return false;
  try {
    await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type: 'public-key', id: b64d(a.cred), transports: ['internal'] }], userVerification: 'required', timeout: 60000 } });
    return true;
  } catch { return false; }
}
let bloqueado = true, escondidoEm = 0;
function telaBloqueio() {
  const a = ls.get('irawo_auth', null);
  const host = $('#lockHost');
  $('#view').inert = $('#nav').inert = bloqueado;
  if (!bloqueado) { host.innerHTML = ''; return; }
  const temBio = a && a.cred && window.PublicKeyCredential;
  host.innerHTML = a ? `<div class="lock"><div class="mark">IRAWÒ</div><div class="mut">Digite sua senha</div>
      <input id="lkPw" type="password" autocomplete="current-password" placeholder="senha"><div id="lkErr" class="neg" style="min-height:20px"></div>
      <button class="btn" id="lkOk" style="min-width:200px">Entrar</button>
      ${temBio ? '<button class="btn sec" id="lkBio" style="min-width:200px">Digital / rosto</button>' : ''}</div>`
    : `<div class="lock"><div class="mark">IRAWÒ</div><h2 style="margin:0">Bem-vindo</h2><div class="mut" style="max-width:320px">Crie uma senha para proteger o app neste aparelho.</div>
      <input id="lkPw" type="password" autocomplete="new-password" placeholder="nova senha (mín. 4 caracteres)">
      <input id="lkPw2" type="password" autocomplete="new-password" placeholder="repita a senha"><div id="lkErr" class="neg" style="min-height:20px"></div>
      <button class="btn" id="lkNovo" style="min-width:200px">Criar senha</button></div>`;
  if (temBio) setTimeout(() => { /* iOS exige toque do usuário; Android aceita */ }, 0);
}
function desbloquear() { bloqueado = false; telaBloqueio(); if (cfg) carregar(); else render(); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) escondidoEm = Date.now();
  else if (escondidoEm && Date.now() - escondidoEm > 3 * 60 * 1000 && ls.get('irawo_auth')) { bloqueado = true; telaBloqueio(); }
});

/* ============ modal ============ */
function modal(html) { $('#modalBox').innerHTML = html; $('#modal').classList.add('on'); }
function fecharModal() { $('#modal').classList.remove('on'); $('#modalBox').innerHTML = ''; }
function modalEditar(id) {
  const r = rows.find(x => x.id === id); if (!r) return;
  const cats = L.CATEGORIAS[r.tipo === 'despesa' ? 'despesa' : 'receita'];

  const grupo = rows.filter(x => x.grupo_id === r.grupo_id);
  modal(`<h2 style="margin-top:0">Editar lançamento</h2>
  <label>Descrição</label><input id="eDesc" value="${esc(r.descricao)}">
  <label>${r.tipo === 'despesa' ? 'Fornecedor' : 'Cliente'}</label><input id="ePessoa" value="${esc(r.pessoa)}">
  <label>Categoria</label><select id="eCat">${catsOk.map(c => `<option ${c === r.categoria ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
  <div class="field2"><div><label>Valor (R$)</label><input id="eVal" inputmode="decimal" value="${r.valor}"></div>
  <div><label>Vencimento</label><input id="eVenc" type="date" value="${esc(r.vencimento)}"></div></div>
  <div class="field2"><div><label>Situação</label><select id="eSt"><option value="pago" ${r.status === 'pago' ? 'selected' : ''}>Pago</option><option value="pendente" ${r.status !== 'pago' ? 'selected' : ''}>Pendente</option></select></div>
  <div><label>Data do pagamento</label><input id="ePag" type="date" value="${esc(r.data_pagamento)}"></div></div>
  <label>Observação</label><input id="eObs" value="${esc(String(r.obs || '').replace(/\s*\[prev=[^\]]*\]/, ''))}">
  <div class="row wrap" style="margin-top:16px"><button class="btn danger sm" data-del="${esc(r.id)}">Excluir</button>${grupo.length > 1 ? `<button class="btn danger sm" data-delg="${esc(r.grupo_id)}">Excluir as ${grupo.length} parcelas</button>` : ''}<span class="sp"></span><button class="btn sec sm" data-close>Cancelar</button><button class="btn sm" data-esave="${esc(r.id)}">Salvar</button></div>`);
}
function modalBaixa(id, veioDaSugestao) {
  const r = rows.find(x => String(x.id) === String(id)); if (!r) return;
  const sug = veioDaSugestao && sugestaoBaixa;
  const val = sug && sug.valor ? sug.valor : r.valor;
  ctxBaixa = Object.assign({}, r);
  modal(`<h2 style="margin-top:0">Dar baixa</h2><div class="mut">${esc(r.descricao)}${r.pessoa ? ' · ' + esc(r.pessoa) : ''} · parcela ${r.parcela}/${r.total_parcelas}</div>
  <div class="card" style="margin:12px 0;padding:12px"><div class="row"><span class="mut">Valor da parcela</span><span class="sp"></span><b>${brl(r.valor)}</b></div></div>
  <div class="field2"><div><label>Valor ${r.tipo === 'despesa' ? 'pago' : 'recebido'} (R$)</label><input id="bVal" inputmode="decimal" value="${val}"></div>
  <div><label>Data</label><input id="bData" type="date" value="${sug && L.valida(sug.dataPag) ? sug.dataPag : L.hojeDe()}"></div></div>
  <div id="bModo"></div>
  <label>Forma</label><select id="bForma">${['', 'pix', 'dinheiro', 'cartão', 'transferência', 'boleto'].map(f => `<option ${f === r.forma ? 'selected' : ''} value="${f}">${f || '—'}</option>`).join('')}</select>
  <div class="row" style="margin-top:16px"><button class="btn sec sp" data-close>Cancelar</button><button class="btn green sp" data-bsave="${esc(r.id)}">Confirmar baixa</button></div>`);
  atualizaModoBaixa();
}
function atualizaModoBaixa() {
  const r = ctxBaixa, el = $('#bModo'); if (!r || !el) return;
  const pago = L.cent(num($('#bVal').value)), orig = L.cent(r.valor), diff = orig - pago;
  if (!pago || diff === 0) { el.innerHTML = ''; return; }
  const prox = rows.filter(x => x.grupo_id === r.grupo_id && x.status === 'pendente' && String(x.id) !== String(r.id) && x.parcela > r.parcela).length;
  const mais = diff < 0, dif = brl(Math.abs(diff) / 100);
  const dir = diff < 0 ? 'mais' : 'menos';
  const atual = ctxBaixa.dir === dir ? (document.querySelector('input[name=bmodo]:checked') || {}).value : undefined;
  ctxBaixa.dir = dir;
  const ops = [['quitar', 'Parcela quitada com este valor', `A parcela passa a valer ${brl(pago / 100)}; as outras ficam como estão.`]];
  if (prox) ops.push(['ajustar', mais ? `Abater ${dif} das próximas parcelas` : `Cobrar ${dif} a mais nas próximas parcelas`, 'O total do serviço continua o mesmo.']);
  if (!mais) ops.push(['parcial', 'Pagamento parcial', `Os ${dif} que faltam continuam pendentes nesta parcela.`]);
  const padrao = ops.some(o => o[0] === atual) ? atual : (mais ? (prox ? 'ajustar' : 'quitar') : 'parcial');
  el.innerHTML = `<div class="card" style="margin-top:12px;padding:12px"><b>${mais ? 'Pagou ' + dif + ' a mais' : 'Pagou ' + dif + ' a menos'} que a parcela. O que fazer?</b>${ops.map(o => `<label class="opt"><input type="radio" name="bmodo" value="${o[0]}" ${o[0] === padrao ? 'checked' : ''}><span><b>${o[1]}</b><br><span class="mut" style="font-size:12px">${o[2]}</span></span></label>`).join('')}</div>`;
}
function modalCatg(t, i) {
  const nome = i >= 0 ? L.CATEGORIAS[t][i] : '';
  modal(`<h2 style="margin-top:0">${i >= 0 ? 'Editar' : 'Nova'} categoria de ${t === 'receita' ? 'receita' : 'despesa'}</h2>
  <label>Nome</label><input id="gNome" value="${esc(nome)}" placeholder="Ex.: Consultas">
  ${i >= 0 ? '<div class="hint" style="margin-top:8px">Ao renomear, os lançamentos que já usam esta categoria também são atualizados.</div>' : ''}
  <div class="row wrap" style="margin-top:16px">${i >= 0 ? `<button class="btn danger sm" data-catgdel="${t}:${i}">Excluir</button>` : ''}<span class="sp"></span><button class="btn sec sm" data-close>Cancelar</button><button class="btn sm" data-catgsave="${t}:${i}">Salvar</button></div>`);
  setTimeout(() => $('#gNome') && $('#gNome').focus(), 100);
}
async function gravaCategorias(t, lista) {
  const body = { receita: t === 'receita' ? lista : L.CATEGORIAS.receita, despesa: t === 'despesa' ? lista : L.CATEGORIAS.despesa };
  try { const j = await api('salvarCategorias', body); aplicaCategorias(j.dados); ls.set('irawo_catg', j.dados); toast('Categorias salvas'); return true; }
  catch (e) { toast(e.message, true); return false; }
}
async function renomeiaCategoria(t, antigo, novo) {
  const itens = rows.filter(r => r.tipo === t && r.categoria === antigo).map(r => ({ id: r.id, categoria: novo }));
  if (itens.length) await salvarOp('atualizar', { itens });
  if (t === 'receita' && catalogo.some(c => c.categoria === antigo)) await gravaCatalogo(catalogo.map(c => c.categoria === antigo ? { ...c, categoria: novo } : c), 'Categoria atualizada');
}
function modalCat(i) {
  const c = i >= 0 ? catalogo[i] : { nome: '', valor: '', categoria: L.CATEGORIAS.receita[0] };
  modal(`<h2 style="margin-top:0">${i >= 0 ? 'Editar' : 'Novo'} produto padrão</h2>
  <label>Nome</label><input id="cNome" value="${esc(c.nome)}" placeholder="Ex.: BORI">
  <label>Valor (R$)</label><input id="cVal" inputmode="decimal" value="${c.valor}">
  <label>Categoria</label><select id="cCat">${L.CATEGORIAS.receita.map(k => `<option ${k === c.categoria ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select>
  <div class="row wrap" style="margin-top:16px">${i >= 0 ? `<button class="btn danger sm" data-catdel="${i}">Excluir</button>` : ''}<span class="sp"></span><button class="btn sec sm" data-close>Cancelar</button><button class="btn sm" data-catsave="${i}">Salvar</button></div>`);
}
async function gravaCatalogo(lista, msg) {
  try { const j = await api('salvarCatalogo', { itens: lista }); catalogo = j.dados; ls.set('irawo_cat', catalogo); toast(msg); return true; }
  catch (e) { toast(e.message, true); return false; }
}
const num = s => { const v = parseFloat(String(s).replace(/\./g, m => (String(s).includes(',') ? '' : m)).replace(',', '.')); return isNaN(v) ? 0 : v; };

/* ============ eventos (delegação) ============ */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-mes],[data-aba],[data-tog],[data-baixa],[data-desfaz],[data-edit],[data-f],[data-lanc],[data-quick],[data-catg],[data-catgnew],[data-catgsave],[data-catgdel],[data-cat],[data-catnew],[data-catsave],[data-catdel],[data-rdel],[data-rset],[data-radd],[data-rcancel],[data-rsave],[data-close],[data-del],[data-delg],[data-esave],[data-bsave],#salvaCfg,#btnDemo,#btnSair,#trocaSenha,#toggleBio,#bloqueia,#lkOk,#lkBio,#lkNovo,#okRec,#cancelRec,#anexarAudio,#okTxt,#chkQ');
  if (!t) return;
  const d = t.dataset;
  if (d.go) { e.preventDefault(); if (d.go !== 'lancar') { revisao = null; sugestaoBaixa = null; } return ir(d.go); }
  if (d.mes) { mesSel = L.addMesYM(mesSel, +d.mes); return render(); }
  if (d.aba) { abaReceber = d.aba; return render(); }
  if (d.tog) { abertos.has(d.tog) ? abertos.delete(d.tog) : abertos.add(d.tog); return render(); }
  if (t.id === 'chkQ') { verQuitados = t.checked; return render(); }
  if (d.f) { const [k, v] = d.f.split(':'); filtroExtrato[k] = v; return render(); }
  if (d.edit) return modalEditar(d.edit);
  if (d.quick !== undefined) { const c = catalogo[+d.quick]; if (!c) return; const it = itemVazio('receita'); Object.assign(it, { descricao: c.nome, valor_total: c.valor, produto: c.nome, categoria: c.categoria || it.categoria }); revisao = { mensagem: '', itens: [it] }; return render(); }
  if (d.catg !== undefined) { const [t, i] = d.catg.split(':'); return modalCatg(t, +i); }
  if (d.catgnew !== undefined) return modalCatg(d.catgnew, -1);
  if (d.catgsave !== undefined) {
    const [t, i] = d.catgsave.split(':'), k = +i, nome = $('#gNome').value.trim();
    if (!nome) return toast('Informe o nome da categoria.', true);
    const lista = L.CATEGORIAS[t].slice();
    if (lista.some((c, j) => j !== k && L.norm(c) === L.norm(nome))) return toast('Essa categoria já existe.', true);
    const antigo = k >= 0 ? lista[k] : null;
    if (k >= 0) lista[k] = nome; else lista.push(nome);
    if (await gravaCategorias(t, lista)) { if (antigo && antigo !== nome) await renomeiaCategoria(t, antigo, nome); fecharModal(); }
    return render();
  }
  if (d.catgdel !== undefined) {
    const [t, i] = d.catgdel.split(':'), nome = L.CATEGORIAS[t][+i];
    if (L.CATEGORIAS[t].length <= 1) return toast('Mantenha ao menos uma categoria.', true);
    const usa = rows.filter(r => r.tipo === t && r.categoria === nome).length;
    if (confirm(`Excluir "${nome}"?` + (usa ? ` ${usa} lançamento(s) continuam com esse nome.` : '')) && await gravaCategorias(t, L.CATEGORIAS[t].filter((_, j) => j !== +i))) fecharModal();
    return render();
  }
  if (d.cat !== undefined) return modalCat(+d.cat);
  if ('catnew' in d) return modalCat(-1);
  if (d.catsave !== undefined) {
    const nome = $('#cNome').value.trim(), valor = num($('#cVal').value);
    if (!nome || !(valor > 0)) return toast('Informe o nome e o valor.', true);
    const lista = catalogo.slice(), item = { nome, valor, categoria: $('#cCat').value }, k = +d.catsave;
    if (k >= 0) lista[k] = item; else lista.push(item);
    if (await gravaCatalogo(lista, 'Produto salvo')) fecharModal(); return render();
  }
  if (d.catdel !== undefined) { if (confirm('Excluir este produto padrão?') && await gravaCatalogo(catalogo.filter((_, k) => k !== +d.catdel), 'Produto excluído')) fecharModal(); return render(); }
  if (d.baixa !== undefined) return modalBaixa(d.baixa, !!d.sug);
  if (d.desfaz) {
    let pl; try { pl = L.planejarDesfazer(rows, d.desfaz); } catch (er) { return toast(er.message, true); }
    let ok = await salvarOp('atualizar', { itens: pl.atualizar });
    if (ok && pl.excluir.length) ok = await salvarOp('excluir', { ids: pl.excluir });
    if (ok) toast('Baixa desfeita');
    return render();
  }
  if ('close' in d) return fecharModal();
  if (d.lanc) {
    if (d.lanc === 'audio') return abrirGravacao();
    if (d.lanc === 'foto') return $('#fileFoto').click();
    if (d.lanc === 'video') return $('#fileVideo').click();
    if (d.lanc === 'texto') return abrirTexto();
    if (d.lanc === 'manual') { revisao = { mensagem: '', itens: [itemVazio('receita')] }; return render(); }
  }
  if (t.id === 'okTxt') { const v = $('#txtIA').value.trim(); if (!v) return; fecharModal(); return interpretar([], v); }
  if (t.id === 'anexarAudio') { e.preventDefault(); if (gravador) { gravador.enviar = false; gravador.mr.state !== 'inactive' && gravador.mr.stop(); } fecharModal(); return $('#fileAudio').click(); }
  if (t.id === 'cancelRec') { if (gravador) { gravador.enviar = false; gravador.mr.state !== 'inactive' && gravador.mr.stop(); } return fecharModal(); }
  if (t.id === 'okRec') { if (gravador) { gravador.enviar = true; gravador.mr.stop(); } return; }
  if (d.rdel !== undefined) { revisao.itens.splice(+d.rdel, 1); return render(); }
  if (d.rset) { const [i, k, v] = d.rset.split(':'); revisao.itens[+i][k] = v; revisao.itens[+i].categoria = L.CATEGORIAS[v][0]; return render(); }
  if ('radd' in d) { revisao.itens.push(itemVazio(revisao.itens.length ? revisao.itens[revisao.itens.length - 1].tipo : 'despesa')); return render(); }
  if ('rcancel' in d) { revisao = null; sugestaoBaixa = null; return render(); }
  if ('rsave' in d) {
    const lista = [];
    for (const it of revisao.itens) {
      if (!(num(it.valor_total) > 0)) return toast('Preencha o valor de todos os itens.', true);
      if (!String(it.descricao).trim()) it.descricao = it.categoria;
      L.expandir({ ...it, valor_total: num(it.valor_total), entrada: num(it.entrada), parcelas: +it.parcelas || 1 }).forEach(l => lista.push(l));
    }
    t.disabled = true;
    if (await salvarOp('adicionar', { itens: lista }, `${lista.length} lançamento(s) salvo(s)`)) { revisao = null; view = 'inicio'; }
    return render();
  }
  if (d.del) { if (confirm('Excluir este lançamento?') && await salvarOp('excluir', { ids: [d.del] }, 'Excluído')) fecharModal(); return render(); }
  if (d.delg) { const ids = rows.filter(r => r.grupo_id === d.delg).map(r => r.id); if (confirm(`Excluir as ${ids.length} parcelas deste serviço?`) && await salvarOp('excluir', { ids }, 'Serviço excluído')) fecharModal(); return render(); }
  if (d.esave) {
    const st = $('#eSt').value;
    const ok = await salvarOp('atualizar', { itens: [{ id: d.esave, descricao: $('#eDesc').value, pessoa: $('#ePessoa').value, categoria: $('#eCat').value, valor: num($('#eVal').value),
      vencimento: $('#eVenc').value, status: st, data_pagamento: st === 'pago' ? ($('#ePag').value || L.hojeDe()) : '', obs: $('#eObs').value + ((String((rows.find(x => String(x.id) === String(d.esave)) || {}).obs || '').match(/\s*\[prev=[^\]]*\]/) || [''])[0]) }] }, 'Salvo');
    if (ok) fecharModal(); return render();
  }
  if (d.bsave) {
    const dt = $('#bData').value || L.hojeDe(), val = num($('#bVal').value);
    if (!(val > 0)) return toast('Informe o valor.', true);
    const modo = (document.querySelector('input[name=bmodo]:checked') || {}).value || 'quitar';
    let pl; try { pl = L.planejarBaixa(rows, d.bsave, { valor: val, data: dt, forma: $('#bForma').value, modo }); } catch (er) { return toast(er.message, true); }
    let ok = await salvarOp('atualizar', { itens: pl.atualizar });
    if (ok && pl.adicionar.length) ok = await salvarOp('adicionar', { itens: pl.adicionar });
    if (ok) { toast('Baixa registrada'); fecharModal(); if (sugestaoBaixa) { abaReceber = sugestaoBaixa.busca.tipo === 'despesa' ? 'despesa' : 'receita'; sugestaoBaixa = null; view = 'receber'; } }
    return render();
  }
  if (t.id === 'salvaCfg') {
    const url = $('#cfgUrl').value.trim(), token = $('#cfgTok').value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url) || !token) return toast('Informe o endereço do script (terminado em /exec) e o código de acesso.', true);
    const antes = cfg; cfg = { url, token };
    try { await api('status'); ls.set('irawo_cfg', cfg); toast('Conectado!'); await carregar(); } catch (er) { cfg = antes; toast(er.message, true); }
    return render();
  }
  if (t.id === 'btnDemo') { cfg = { url: 'demo', token: '' }; ls.set('irawo_cfg', cfg); if (!ls.get('irawo_demo', []).length) semearDemo(); rows = ls.get('irawo_demo', []); view = 'inicio'; return carregar(); }
  if (t.id === 'btnSair') { if (confirm('Desconectar deste aparelho? (os dados continuam na planilha)')) { cfg = null; rows = []; ls.del('irawo_cfg'); ls.del('irawo_cache'); render(); } return; }
  if (t.id === 'trocaSenha') {
    modal(`<h2 style="margin-top:0">${ls.get('irawo_auth') ? 'Trocar senha' : 'Criar senha'}</h2><input id="nPw" type="password" placeholder="nova senha (mín. 4)"><div class="row" style="margin-top:12px"><button class="btn sec sp" data-close>Cancelar</button><button class="btn sp" id="okNPw">Salvar</button></div>`);
    $('#okNPw').onclick = async () => { const v = $('#nPw').value; if (v.length < 4) return toast('Mínimo 4 caracteres.', true); await definirSenha(v); fecharModal(); toast('Senha atualizada'); render(); };
    return;
  }
  if (t.id === 'toggleBio') {
    const a = ls.get('irawo_auth');
    if (a.cred) { a.cred = null; ls.set('irawo_auth', a); toast('Biometria desativada'); return render(); }
    try { await registrarBiometria(); toast('Digital / rosto ativado ✓'); } catch { toast('Não foi possível ativar neste aparelho.', true); }
    return render();
  }
  if (t.id === 'bloqueia') { bloqueado = true; return telaBloqueio(); }
  if (t.id === 'lkNovo') {
    const a = $('#lkPw').value, b = $('#lkPw2').value;
    if (a.length < 4) return $('#lkErr').textContent = 'Use pelo menos 4 caracteres.';
    if (a !== b) return $('#lkErr').textContent = 'As senhas não conferem.';
    await definirSenha(a);
    if (window.PublicKeyCredential && confirm('Quer entrar também com digital / rosto?')) { try { await registrarBiometria(); } catch { toast('Biometria não disponível aqui.', true); } }
    return desbloquear();
  }
  if (t.id === 'lkOk') {
    const a = ls.get('irawo_auth');
    if (await hashSenha($('#lkPw').value, a.salt) === a.hash) return desbloquear();
    $('#lkErr').textContent = 'Senha incorreta.'; $('#lkPw').value = ''; return;
  }
  if (t.id === 'lkBio') { if (await entrarComBiometria()) return desbloquear(); $('#lkErr').textContent = 'Não reconhecido. Use a senha.'; return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && $('#lkOk') && e.target.id === 'lkPw') $('#lkOk').click();
});
document.addEventListener('input', e => {
  if (e.target.id === 'bVal') atualizaModoBaixa();
  const f = e.target.dataset && e.target.dataset.rf;
  if (f && revisao) { const [i, ...k] = f.split(':'); revisao.itens[+i][k.join(':')] = e.target.value; }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.rf && revisao) { const [i, k] = el.dataset.rf.split(':'); revisao.itens[+i][k] = el.value; if (['parcelas', 'entrada', 'valor_total', 'primeiro_vencimento', 'data'].includes(k)) { const sx = scrollY; render(); scrollTo(0, sx); } return; }
  if (el.dataset.rprod !== undefined && revisao) {
    const c = catalogo[+el.value], it = revisao.itens[+el.dataset.rprod];
    if (c) { it.descricao = c.nome; it.valor_total = c.valor; it.produto = c.nome; if (c.categoria) it.categoria = c.categoria; }
    else it.produto = '';
    return render();
  }
  if (el.dataset.rchk && revisao) { revisao.itens[+el.dataset.rchk].pago = el.checked; return render(); }
  if (el.id === 'fMes') { filtroExtrato.mes = el.value; return render(); }
  if (el.id === 'fileFoto' && el.files.length) {
    try { bloquear('Preparando as fotos…'); const ms = []; for (const f of [...el.files].slice(0, 4)) ms.push({ tipo: 'imagem', mime: 'image/jpeg', base64: await blobB64(await reduzImagem(f)) }); el.value = ''; await interpretar(ms); }
    catch (er) { toast(er.message, true); render(); }
    return;
  }
  if (el.id === 'fileVideo' && el.files.length) {
    const f = el.files[0]; el.value = '';
    if (f.size > 20 * 1024 * 1024) return toast('Vídeo grande demais (máx. ~20 MB). Grave um mais curto.', true);
    bloquear('Enviando o vídeo…'); return interpretar([{ tipo: 'video', mime: f.type || 'video/mp4', base64: await blobB64(f) }]);
  }
  if (el.id === 'fileAudio' && el.files.length) {
    const f = el.files[0]; el.value = '';
    try { bloquear('Preparando o áudio…'); await interpretar([{ tipo: 'audio', formato: 'wav', base64: await blobParaWav(f) }]); }
    catch { toast('Não consegui ler esse áudio. Grave pelo botão do app.', true); render(); }
  }
});

/* ============ início ============ */
(function iniciar() {
  // link de configuração: #cfg=base64({u,t}) — vale uma vez e some da barra de endereço
  try {
    const m = location.hash.match(/cfg=([^&]+)/);
    if (m) { const o = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); if (o.u && o.t && /\/dev$/.test(o.u)) window.__cfgErro = 'Link com endereço de teste. Gere o link de novo na planilha.'; else if (o.u && o.t) { cfg = { url: o.u, token: o.t }; ls.set('irawo_cfg', cfg); rows = []; ls.del('irawo_cache'); }
      history.replaceState(null, '', location.pathname + location.search); }
  } catch {}
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const tinha = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
    // quando uma versão nova assume o controle, recarrega uma vez para mostrar o app atualizado
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (tinha && !window.__recarregou) { window.__recarregou = true; location.reload(); } });
  }
  bloqueado = !!ls.get('irawo_auth') || true;
  telaBloqueio();
  render();
  if (window.__cfgErro) toast(window.__cfgErro, true);
})();
</script>
